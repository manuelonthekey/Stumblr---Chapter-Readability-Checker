server.port=${PORT:8080}
spring.servlet.multipart.max-request-size=512KB
spring.servlet.multipart.max-file-size=512KB
spring.mvc.pathmatch.use-suffix-pattern=false

# CORS — override with env var in production
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Actuator — expose health only
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.server.base-path=/

# Logging — never log user text
logging.level.com.chaptercheck=INFO
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{36} - %msg%n
